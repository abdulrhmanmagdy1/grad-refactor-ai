[project]
name = "grad-refactor-ai"
version = "0.1.0"
description = "Python multi-agent refactoring graduation project foundation"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refactor_ai", "src/core", "src/agents", "src/models", "src/api", "src/runner", "src/evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
# The blinded review packet contains candidate code that raters must see exactly
# as the harness produced it; formatting it would silently rewrite review inputs.
extend-exclude = ["experiments/review"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
