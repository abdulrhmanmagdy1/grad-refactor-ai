<svg xmlns="http://www.w3.org/2000/svg" width="760" height="226" viewBox="0 0 760 226" role="img" aria-label="Latency per case by arm (median and 10th-90th percentile; validation split)">
<title>Latency per case by arm (median and 10th-90th percentile; validation split)</title>
<style>
  .surface { fill: #fcfcfb; }
